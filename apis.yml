name: Renoster Systems
description: 'Renoster Systems is a carbon-credit ratings agency bringing deep transparency
  to the nature-based voluntary carbon markets. Using remote sensing, LiDAR, satellite
  data, and machine learning, Renoster independently rates forestry and other nature-based
  carbon offset projects, quantifying how much CO2 per credit a project has actually
  sequestered, and publishes public tools such as its Mercury project database and
  Renoster/Mercury rubric for researchers, reserve managers, policymakers, and corporate
  buyers. Renoster is a Techstars-backed startup. As of this profile the company does
  not publish a public developer API, SDKs, or machine-readable API surface; this
  record captures its company identity and public web properties.'
